<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14122b"/>
      <stop offset="0.55" stop-color="#232050"/>
      <stop offset="1" stop-color="#2d3a6b"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc8dd"/>
      <stop offset="0.5" stop-color="#cdb4db"/>
      <stop offset="1" stop-color="#a0c4ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cdb4db" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#cdb4db" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="900" height="260" rx="18"/></clipPath>
    <clipPath id="type">
      <rect x="250" y="178" width="0" height="34">
        <animate attributeName="width" values="0;400;400;0" keyTimes="0;0.45;0.9;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="900" height="260" fill="url(#bg)"/>

    <!-- moon glow + moon -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-8;0,0" dur="6s" repeatCount="indefinite"/>
      <circle cx="760" cy="95" r="90" fill="url(#glow)"/>
      <circle cx="760" cy="95" r="38" fill="#f3e8ff"/>
      <circle cx="778" cy="85" r="34" fill="#232050"/>
    </g>

    <!-- twinkling stars -->
    <g fill="#ffffff">
      <circle cx="60"  cy="40"  r="1.8"><animate attributeName="opacity" values="1;0.15;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="140" cy="200" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="210" cy="70"  r="2"><animate attributeName="opacity" values="1;0.2;1" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="30"  r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="420" cy="225" r="1.8"><animate attributeName="opacity" values="1;0.1;1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="50"  r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="610" cy="215" r="2"><animate attributeName="opacity" values="1;0.2;1" dur="3.3s" repeatCount="indefinite"/></circle>
      <circle cx="660" cy="30"  r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="860" cy="200" r="1.6"><animate attributeName="opacity" values="1;0.2;1" dur="3.9s" repeatCount="indefinite"/></circle>
      <circle cx="30"  cy="130" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.1s" repeatCount="indefinite"/></circle>
      <circle cx="880" cy="60"  r="1.2"><animate attributeName="opacity" values="1;0.3;1" dur="3.1s" repeatCount="indefinite"/></circle>
    </g>

    <!-- shooting star -->
    <g>
      <line x1="0" y1="0" x2="-70" y2="-28" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0">
        <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1;1" dur="7s" repeatCount="indefinite"/>
      </line>
      <animateTransform attributeName="transform" type="translate" values="-100,120; 520,-20" dur="7s" repeatCount="indefinite"/>
    </g>

    <!-- name -->
    <text x="450" y="125" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="6" fill="url(#name)">
      KANAK
      <animate attributeName="opacity" values="0;1" dur="1.5s" fill="freeze"/>
    </text>
    <text x="450" y="158" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" letter-spacing="7" fill="#cdb4db" opacity="0.9">COMPUTER SCIENCE STUDENT</text>

    <!-- typed line -->
    <g clip-path="url(#type)">
      <text x="450" y="200" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="18" fill="#a0c4ff">turning confusion into clarity</text>
    </g>
  </g>
</svg>
